name: vpngate2proxy

services:
  softether:
    image: ghcr.io/smileawei/aimili-vpngate-softether:${SOFTETHER_IMAGE_TAG:-latest}
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      VPN_BACKEND: softether
      LOCAL_PROXY_HOST: "0.0.0.0"
      LOCAL_PROXY_PORT: "7929"
      SOFTETHER_UPSTREAM_PROXY: "${SOFTETHER_UPSTREAM_PROXY:-socks5://10.220.10.253:1081}"
    ports:
      - "0.0.0.0:7929:7929"
      - "0.0.0.0:8787:8787"
    volumes:
      - ./data:/data
    init: true
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
