name: vpngate2proxy

include:
  - compose.native.yaml

services:
  aimilivpn:
    profiles:
      - legacy-openvpn
    image: aimili-vpngate:2.2.1-local
    build:
      context: .
      args:
        BUILD_VERSION: "2.2.1"
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      DEPLOYMENT_MODE: docker
      VPNGATE_DATA_DIR: /data
      UI_HOST: "0.0.0.0"
      UI_PORT: "8787"
      LOCAL_PROXY_HOST: "127.0.0.1"
      LOCAL_PROXY_PORT: "7928"
      CHECK_INTERVAL_SECONDS: "1260"
      TARGET_VALID_NODES: "3"
      PROXY_FAILURE_THRESHOLD: "3"
    ports:
      - "${UI_BIND_HOST:-0.0.0.0}:${UI_PORT:-8787}:8787"
    volumes:
      - ./data:/data
    init: true
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
