name: Publish formal release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing formal tag to publish, for example v2.2.0
        required: true
        default: v2.2.0
        type: string

concurrency:
  group: formal-release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.11', '3.13']
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify formal version tag
        run: test "$RELEASE_TAG" = "v$(tr -d '\r\n' < VERSION)"
      - name: Compile application and backends
        run: python -m py_compile *.py native/*.py
      - name: Validate installation and deployments
        run: |
          bash -n install.sh
          docker compose config --quiet
          docker compose -f compose.ghcr.yaml config --quiet
      - name: Run regression tests
        run: python -m unittest discover -s tests -v

  docker:
    name: Publish ${{ matrix.backend }} images
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: softether
            file: native/Dockerfile
            suffix: '-softether'
            platforms: linux/amd64,linux/arm64
            scope: softether
          - backend: openvpn
            file: Dockerfile
            suffix: ''
            platforms: linux/amd64,linux/386,linux/arm64,linux/arm/v7
            scope: release-openvpn
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Resolve image tags
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          SUFFIX: ${{ matrix.suffix }}
        run: |
          version="${RELEASE_TAG#v}"
          minor="$(printf '%s' "$version" | cut -d. -f1,2)"
          echo "name=ghcr.io/${REPOSITORY,,}${SUFFIX}" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "minor=$minor" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish versioned images
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.minor }}
            ${{ steps.image.outputs.name }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.image.outputs.revision }}
          build-args: BUILD_VERSION=${{ steps.image.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.scope }}
      - name: Smoke test every published architecture
        env:
          IMAGE: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}
          VERSION: ${{ steps.image.outputs.version }}
          BACKEND: ${{ matrix.backend }}
          PLATFORMS: ${{ matrix.platforms }}
        run: |
          for platform in ${PLATFORMS//,/ }; do
            docker run --rm --platform "$platform" --entrypoint python3 "$IMAGE" -c 'import sys,vpngate_manager as app; assert app.APP_VERSION==sys.argv[1]; assert app.VPN_BACKEND==sys.argv[2]; print(app.APP_VERSION_LABEL,app.VPN_PROTOCOL_LABEL)' "$VERSION" "$BACKEND"
            if [ "$BACKEND" = softether ]; then
              docker run --rm --platform "$platform" --entrypoint sh "$IMAGE" -c 'command -v dhclient && test -x /opt/native/dhcp.py && vpnclient start && vpncmd localhost /CLIENT /CMD NicList && vpnclient stop'
            fi
          done
      - name: Summarize published image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          VERSION: ${{ steps.image.outputs.version }}
        run: echo "Published $IMAGE:$VERSION and latest" >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Publish source archive and GitHub release
    needs: docker
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Build and validate complete source archive
        run: |
          python scripts/build_release_archives.py --output-dir dist
          mkdir /tmp/release-check
          tar -xzf dist/*-source.tar.gz -C /tmp/release-check --strip-components=1
          cd /tmp/release-check
          python -m py_compile *.py native/*.py
          docker compose config --quiet
          docker compose -f compose.ghcr.yaml config --quiet
          python -c 'import vpngate_manager; print(vpngate_manager.APP_VERSION_LABEL)'
      - name: Publish GitHub formal release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="AimiliVPN V$(tr -d '\r\n' < VERSION) 正式版"
          notes="docs/releases/${RELEASE_TAG}.md"
          if [ ! -f "$notes" ]; then notes=RELEASE_NOTES.md; fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --title "$title" --notes-file "$notes" --latest
          else
            gh release create "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "$title" --notes-file "$notes" --verify-tag --latest
          fi
