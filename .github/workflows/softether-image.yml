name: Publish SoftEther image

on:
  push:
    branches: [main]
    paths:
      - '*.py'
      - VERSION
      - native/**
      - mirror/**
      - tests/**
      - .dockerignore
      - compose.ghcr.yaml
      - .github/workflows/softether-image.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: softether-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Validate image-only deployment
        run: docker compose -f compose.ghcr.yaml config --quiet

  publish:
    needs: test
    if: github.ref == 'refs/heads/main' && !startsWith(github.event.head_commit.message, 'Release v')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Resolve image name and immutable tag
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          echo "name=ghcr.io/${REPOSITORY,,}-softether" >> "$GITHUB_OUTPUT"
          echo "version=sha-$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish amd64 and arm64
        uses: docker/build-push-action@v7
        with:
          context: .
          file: native/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: BUILD_VERSION=${{ steps.image.outputs.version }}
          cache-from: type=gha,scope=softether
          cache-to: type=gha,mode=max,scope=softether
      - name: Smoke test published image
        env:
          IMAGE: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}
        run: |
          docker pull "$IMAGE"
          for platform in linux/amd64 linux/arm64; do
            docker run --rm --platform "$platform" --entrypoint python3 "$IMAGE" -c 'import vpngate_manager, softether_backend, hotstandby; print(vpngate_manager.VPN_PROTOCOL_LABEL)'
            docker run --rm --platform "$platform" --entrypoint sh "$IMAGE" -c 'command -v dhclient && test -x /opt/native/dhcp.py && vpnclient start && vpncmd localhost /CLIENT /CMD NicList && vpnclient stop'
          done
      - name: Show published images
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          VERSION: ${{ steps.image.outputs.version }}
        run: |
          echo "### SoftEther Docker image" >> "$GITHUB_STEP_SUMMARY"
          echo "- $IMAGE:latest" >> "$GITHUB_STEP_SUMMARY"
          echo "- $IMAGE:$VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "- Platforms: linux/amd64, linux/arm64" >> "$GITHUB_STEP_SUMMARY"
